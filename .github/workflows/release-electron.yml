name: Build and Release FabiNav

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Crear o actualizar Release en GitHub (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build FabiNav (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron desktop toolchain
        run: npm run electron:setup

      - name: Build Web App and Electron Exe
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload built .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabinav-windows-exe
          path: dist-electron/*.exe
          if-no-files-found: error

      - name: Get version from package.json
        id: pkg
        if: ${{ github.event_name == 'push' || inputs.publish_release == 'true' }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create or Update Release
        if: ${{ github.event_name == 'push' || inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: FabiNav v${{ steps.pkg.outputs.version }}
          tag_name: v${{ steps.pkg.outputs.version }}
          prerelease: false
          body: |
            ## FabiNav v${{ steps.pkg.outputs.version }}

            ### Instalación
            Descarga el archivo `.exe` y ejecútalo para instalar FabiNav en Windows.

            ### Actualización desde versión anterior
            Si ya tienes FabiNav instalado, solo ejecuta el nuevo instalador `.exe` y actualizará tu instalación conservando tus datos locales.
          files: |
            dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
