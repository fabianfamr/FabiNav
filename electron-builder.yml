appId: com.fabinav.browser
productName: FabiNav
copyright: Copyright © 2026 FabiNav
asar: true

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json
  - "!node_modules/vite/**"
  - "!src/**"

publish:
  provider: github
  owner: fabianfamr
  repo: FabiNav
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: FabiNav-${version}-win-${arch}-${target}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FabiNav
  uninstallDisplayName: FabiNav
  deleteAppDataOnUninstall: true
  include: electron/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Network;WebBrowser
  icon: build/icon.png
  maintainer: FabiNav <support@fabinav.app>
  artifactName: FabiNav-${version}-linux-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: build/icon.png
  artifactName: FabiNav-${version}-mac-${arch}.${ext}
